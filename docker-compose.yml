services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Copy .env.example to .env and fill in real values before `docker compose up`.
    # The .env file is read at runtime only; it is never baked into the image.
    env_file:
      - .env
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./index:/app/index
      - ./data:/app/data
      - ./runs:/app/runs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
