name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-pdf.txt pytest -c constraints/linux-py312.txt

      - name: Product readiness smoke
        run: bash scripts/product_readiness_smoke.sh

      - name: Hardening test suites
        run: |
          python -m pytest \
            tests/test_api_auth.py \
            tests/test_tenant_isolation.py \
            tests/test_answer_cache.py \
            tests/test_confidence_guard.py -q

      - name: Run full test suite
        run: python -m pytest -q
        timeout-minutes: 10
