name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A missing optional package (anthropic, redis) is a failure here, never a silent skip.
      REQUIRE_OPTIONAL_DEPS: "1"
    # Branch protection: require the status check of this job ("test"); every gated step
    # below is folded into its final step (docs/operations/ci_gates.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quota_test
          POSTGRES_USER: quota_test
          POSTGRES_PASSWORD: quota_test  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quota_test -d quota_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the broad-except guard diffs against origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.lock.txt ]; then
            # Hash-locked install (scripts/lock_dependencies.sh): a changed or
            # substituted package fails here.
            # requirements.lock.txt covers requirements.txt + -ja + -pdf + -state + -qdrant.
            python -m pip install --require-hashes -r requirements.lock.txt
            python -m pip install pytest -c constraints/linux-py312.txt
          else
            # Same set as the Docker image (Sudachi, Redis/Postgres, Qdrant), so their tests run too.
            python -m pip install -r requirements.txt -r requirements-pdf.txt -r requirements-ja.txt -r requirements-state.txt -r requirements-qdrant.txt -r requirements-anthropic.txt pytest -c constraints/linux-py312.txt
          fi

      - name: Product readiness smoke
        id: product_readiness
        continue-on-error: true
        run: bash scripts/product_readiness_smoke.sh

      - name: Normalization golden cases (P1-B)
        id: normalization
        continue-on-error: true
        run: python scripts/check_normalization.py

      - name: Stage regression suites (v3)
        id: stage_regression
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_stage1_security.py \
            tests/test_stage2_no_demo_code.py \
            tests/test_stage3_ingestion.py \
            tests/test_stage5_accuracy.py \
            tests/test_query_preprocess.py

      - name: Hardening test suites
        id: hardening
        continue-on-error: true
        run: |
          python -m pytest \
            tests/test_api_auth.py \
            tests/test_tenant_isolation.py \
            tests/test_answer_cache.py \
            tests/test_confidence_guard.py -q

      - name: Dependency vulnerability audit
        id: dependency_audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          # Ignored advisories live in security/pip-audit-ignore.txt (id, package,
          # reason, expiry, reviewer role); an expired or malformed entry fails here.
          IGNORES=$(python scripts/check_audit_ignores.py --print-args)
          # What is installed: the hash-locked sets of the API image / CI
          # (requirements.lock.txt, which also pins the docextract [light] extras)
          # and of the embedding image (requirements-embedding.lock.txt).
          # --disable-pip is valid because every requirement is pinned with hashes.
          python -m pip_audit --require-hashes --disable-pip -r requirements.lock.txt $IGNORES
          python -m pip_audit --require-hashes --disable-pip -r requirements-embedding.lock.txt $IGNORES

      - name: Security static check (bandit, product code, medium or higher)
        id: bandit
        continue-on-error: true
        run: |
          python -m pip install bandit
          python -m bandit -q -r rag_core webapi libs/docextract/src config.py -ll

      - name: Secret scan (detect-secrets; .secrets.baseline lists the reviewed test placeholders)
        id: secret_scan
        continue-on-error: true
        run: |
          python -m pip install detect-secrets
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Production settings guard smoke
        id: production_guard
        continue-on-error: true
        run: python -m pytest -q tests/test_stage6_operations.py

      - name: Synthetic v2 retrieval regression gate
        id: retrieval_gate
        continue-on-error: true
        run: python scripts/eval_regression_gate.py --margin 0.02

      - name: Stage 8 tests
        id: stage8
        continue-on-error: true
        run: python -m pytest -q tests/test_stage8_additions.py

      - name: Static check (pyflakes, no finding allowed)
        id: pyflakes
        continue-on-error: true
        run: |
          python -m pip install pyflakes
          python -m pyflakes rag_core webapi scripts eval tools tests libs config.py rag_grounded.py

      - name: Broad-except guard (ruff BLE001,S110 on changed lines only; legacy code is not linted)
        id: ruff_broad_except
        continue-on-error: true
        run: |
          python -m pip install ruff==0.8.6
          git fetch --no-tags origin main
          # = ruff check --select BLE001,S110 on the .py files of `git diff --name-only --diff-filter=AM origin/main...HEAD`,
          # keeping only findings on added lines. Keep a deliberate broad except with `# noqa: BLE001  <reason>`.
          python scripts/lint_changed_broad_except.py --base origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Screen script unit tests (node --test)
        id: node_unit
        continue-on-error: true
        run: node --test tests/js/*.test.js

      - name: Console (webui) - npm ci
        id: webui_install
        continue-on-error: true
        working-directory: webui
        run: npm ci

      - name: Console (webui) - typecheck
        id: webui_typecheck
        if: ${{ steps.webui_install.outcome == 'success' }}
        continue-on-error: true
        working-directory: webui
        run: npm run typecheck

      - name: Console (webui) - unit tests
        id: webui_tests
        if: ${{ steps.webui_install.outcome == 'success' }}
        continue-on-error: true
        working-directory: webui
        run: npm test

      - name: Console (webui) - build
        id: webui_build
        if: ${{ steps.webui_install.outcome == 'success' }}
        continue-on-error: true
        working-directory: webui
        run: npm run build

      - name: Console (webui) - bundle size budget (gzip; entry <= 120000 B, all JS <= 220000 B)
        id: webui_bundle_budget
        if: ${{ steps.webui_build.outcome == 'success' }}
        continue-on-error: true
        working-directory: webui
        run: |
          python - <<'PY'
          import gzip
          import re
          import sys
          from pathlib import Path

          ENTRY_BUDGET, TOTAL_BUDGET = 120000, 220000
          dist = Path('dist')
          html = (dist / 'index.html').read_text(encoding='utf-8')
          # Initial load = the entry module plus the chunks index.html preloads.
          refs = re.findall(r'<script[^>]+type="module"[^>]+src="([^"]+\.js)"', html)
          refs += re.findall(r'<link[^>]+rel="modulepreload"[^>]+href="([^"]+\.js)"', html)
          if not refs:
              sys.exit('no entry script in dist/index.html')

          def gz(path):
              return len(gzip.compress(path.read_bytes(), compresslevel=9, mtime=0))

          entry = sorted({dist / 'assets' / Path(ref).name for ref in refs})
          entry_size = sum(gz(p) for p in entry)
          total_size = sum(gz(p) for p in sorted((dist / 'assets').glob('*.js')))
          print(f'entry JS (gzip): {entry_size} B / {ENTRY_BUDGET} B  {[p.name for p in entry]}')
          print(f'all JS (gzip):   {total_size} B / {TOTAL_BUDGET} B')
          if entry_size > ENTRY_BUDGET or total_size > TOTAL_BUDGET:
              sys.exit('webui bundle over budget: split routes (React.lazy) or drop dependencies')
          PY

      - name: Console (webui) - npm audit
        id: webui_audit
        if: ${{ steps.webui_install.outcome == 'success' }}
        continue-on-error: true
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Screen browser tests - install Python package
        id: playwright_package
        continue-on-error: true
        run: python -m pip install playwright

      - name: Screen browser tests - install Chromium
        id: playwright_browser
        if: ${{ steps.playwright_package.outcome == 'success' }}
        continue-on-error: true
        run: python -m playwright install --with-deps chromium-headless-shell

      - name: Screen browser tests - E2E
        id: playwright_e2e
        if: ${{ steps.playwright_package.outcome == 'success' && steps.playwright_browser.outcome == 'success' }}
        continue-on-error: true
        run: KURADEN_E2E_REQUIRED=1 python -m pytest -q tests/e2e

      - name: Stage 10 - install extraction backends
        id: stage10_install
        continue-on-error: true
        # Constrained to the audited pins (the [light] extras are in requirements.lock.txt).
        run: python -m pip install -e "libs/docextract[light]" -c constraints/linux-py312.txt

      - name: Stage 10 - extraction tests
        id: stage10_tests
        if: ${{ steps.stage10_install.outcome == 'success' }}
        continue-on-error: true
        run: python -m pytest -q tests/test_stage10_additions.py libs/docextract/tests

      - name: Stage 10 - extraction backend check
        id: stage10_check
        if: ${{ steps.stage10_install.outcome == 'success' }}
        continue-on-error: true
        run: PYTHONPATH=libs/docextract/src python -m docextract check

      - name: PostgreSQL quota store integration tests
        id: postgres
        continue-on-error: true
        env:
          CHATBOT_QUOTA_TEST_ISOLATED: "1"
          LLM_QUOTA_TEST_DSN: "host=127.0.0.1 port=5432 dbname=quota_test user=quota_test password=quota_test"  # pragma: allowlist secret
        run: python -m pytest -q tests/test_llm_quota_store_pg.py

      # Gated (listed in the final gate). The coverage report is informational only.
      # A skip whose reason is not in tests/skip_allowlist.txt fails the run
      # (a missing package must not hide as a skip). tests/e2e runs in playwright_e2e.
      # No per-test timeout: pytest-timeout is not in constraints/linux-py312.txt;
      # the step timeout bounds a hung test.
      - name: Run full test suite (gate; unexpected skips fail; coverage report)
        id: full_suite
        continue-on-error: true
        env:
          CI_FAIL_ON_UNEXPECTED_SKIP: "1"
        run: |
          python -m pip install pytest-cov
          python -m pytest -q --ignore=tests/test_llm_quota_store_pg.py --ignore=tests/e2e --cov=rag_core --cov=webapi --cov=docextract --cov-report=term-missing:skip-covered
        timeout-minutes: 10

      - name: Diagnostic summary and mandatory failure gate
        if: ${{ always() }}
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          steps = json.loads(os.environ['CI_STEPS_JSON'])
          ids = ['product_readiness', 'normalization', 'stage_regression', 'hardening', 'dependency_audit', 'bandit', 'secret_scan', 'production_guard', 'retrieval_gate', 'stage8', 'pyflakes', 'ruff_broad_except', 'node_unit', 'postgres', 'full_suite', 'webui_install', 'webui_typecheck', 'webui_tests', 'webui_build', 'webui_bundle_budget', 'webui_audit', 'playwright_package', 'playwright_browser', 'playwright_e2e', 'stage10_install', 'stage10_tests', 'stage10_check']
          rows = ['| Check | Outcome |', '|---|---|']
          failed = []
          for key in ids:
              outcome = steps.get(key, {}).get('outcome', 'unexecuted')
              if outcome == 'success':
                  status = 'PASS'
              elif outcome == 'failure':
                  status = 'FAILED'
              elif outcome == 'skipped':
                  status = 'BLOCKED (prerequisite)'
              else:
                  status = 'UNEXECUTED'
              rows.append(f'| {key} | {status} |')
              if outcome != 'success':
                  failed.append((key, status))
          report = '\n'.join(rows) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('## Complete CI diagnostic report\n\n' + report)
          if failed:
              print('CI_FINAL_GATE=FAIL', failed)
              sys.exit(1)
          print('CI_FINAL_GATE=PASS')
          PY
