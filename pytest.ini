# Test discovery for a plain `pytest` at the repository root (CI and local runs).
# norecursedirs replaces pytest's defaults, so they are repeated here; 即削除 holds
# files waiting for deletion and is never collected.
[pytest]
testpaths = tests libs/docextract/tests
norecursedirs = 即削除 data runs node_modules webui .venv vectorstore index .* build dist *.egg venv __pycache__
addopts = -rs --strict-markers
