<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>契約管理</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #1f2933; background: #f7f8fa; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin: 12px 0 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input, button, textarea, select { font: inherit; padding: 4px 8px; }
  table { border-collapse: collapse; width: 100%; background: #fff; margin-bottom: 8px; }
  th, td { border: 1px solid #d9dee5; padding: 4px 6px; text-align: left; vertical-align: top; font-size: 0.9rem; }
  tr.pick { cursor: pointer; } tr.pick:hover { background: #eef6ff; }
  .layout { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.4fr); gap: 16px; }
  .st-extracted { color: #a3261b; font-weight: 600; } .st-confirmed { color: #11733b; } .st-corrected { color: #1c5fb8; } .st-missing { color: #6b7280; }
  .warn { color: #a3261b; } .ok { color: #11733b; }
  #message { min-height: 1.4em; color: #3b5bdb; }
  #detail { display: none; background: #fff; border: 1px solid #d9dee5; padding: 8px; }
  .evidence { color: #6b7280; font-size: 0.8rem; }
  textarea { width: 100%; min-height: 6em; font-family: monospace; }
  details { margin-bottom: 10px; background: #fff; border: 1px solid #d9dee5; padding: 8px; }
  pre { white-space: pre-wrap; background: #fff; border: 1px solid #d9dee5; padding: 6px; display: none; }
</style>
</head>
<body>
<!--admin-nav-->
<h1>契約管理</h1>
<p>契約書から抽出した値は、<b>人が確認するまで「未確認」</b>です。期限は暦日で数えた目安で、<b>契約書の文言が優先</b>します。
確認していない値に基づく期限には「未確認」と表示します。</p>
<div class="bar">
  <label>管理トークン（任意） <input id="token" type="password" autocomplete="off"></label>
  <label>テナント <input id="tenant" size="14" value="default"></label>
  <button id="reload">一覧を読み込む</button>
  <button id="dryrun">通知の予定を見る（送らない）</button>
  <button id="sendnow">通知を送る</button>
</div>
<div id="message"></div>
<details>
  <summary>抽出結果を取り込む</summary>
  <label>契約 ID <input id="i_id" size="16" placeholder="service-2026-01"></label>
  <label>元の文書名 <input id="i_doc" size="24"></label>
  <textarea id="i_json" placeholder='{"schema": "contract-extract/v1", "fields": {"counterparty": {"value": "...", "confidence": 0.9, "page": 1, "text": "..."}}}'></textarea>
  <button id="import">取り込む（未確認として保存）</button>
</details>
<div class="layout">
  <div>
    <h2>契約</h2>
    <table><thead><tr><th>契約</th><th>状態</th><th>直近の期限</th><th>未確認</th></tr></thead><tbody id="rows"></tbody></table>
    <h2>これからの期限</h2>
    <table><thead><tr><th>期限</th><th>契約</th><th>種類</th><th>残り</th><th>確認</th></tr></thead><tbody id="deadlines"></tbody></table>
  </div>
  <div>
    <div id="detail">
      <h2 id="d_title"></h2>
      <table><thead><tr><th>項目</th><th>値</th><th>状態</th><th>根拠</th><th>操作</th></tr></thead><tbody id="fields"></tbody></table>
      <h2>期限</h2>
      <table><tbody id="d_deadlines"></tbody></table>
      <h2>履歴</h2>
      <pre id="history"></pre>
    </div>
  </div>
</div>
<pre id="out"></pre>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const doFetch = (url, options) => (window.adminFetch || fetch)(url, options);
  let currentId = null;
  const STATE = { extracted: "未確認", confirmed: "確認済み", corrected: "訂正済み", missing: "なし" };
  const STATUS = { needs_review: "要確認", active: "有効", expired: "終了" };
  function headers() {
    const h = { "Content-Type": "application/json" };
    if ($("token").value) h["X-Admin-Token"] = $("token").value;
    return h;
  }
  function tenant() { return $("tenant").value.trim() || "default"; }
  function show(text) { $("message").textContent = text; }
  function out(value) { const o = $("out"); o.style.display = value ? "block" : "none"; o.textContent = value ? JSON.stringify(value, null, 2) : ""; }
  async function call(method, url, body) {
    const resp = await doFetch(url, { method: method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
    let data = null;
    try { data = await resp.json(); } catch (_) { data = null; }
    return { ok: resp.ok, status: resp.status, data: data };
  }
  function cell(text, cls) { const td = document.createElement("td"); td.textContent = text == null ? "" : String(text); if (cls) td.className = cls; return td; }
  function button(label, onClick) { const b = document.createElement("button"); b.textContent = label; b.addEventListener("click", onClick); return b; }
  function daysText(left) { return left < 0 ? (-left) + " 日超過" : left === 0 ? "本日" : "残り " + left + " 日"; }
  const q = () => "?tenant_id=" + encodeURIComponent(tenant());
  async function load() {
    const list = await call("GET", "/admin/contracts/list" + q());
    if (!list.ok) { show("読み込みに失敗しました (" + list.status + ")"); return; }
    const body = $("rows"); body.textContent = "";
    for (const c of list.data.contracts) {
      const tr = document.createElement("tr"); tr.className = "pick";
      tr.appendChild(cell((c.title || c.contract_id) + " / " + (c.counterparty || "（相手方未設定）")));
      tr.appendChild(cell(STATUS[c.status] || c.status, c.status === "needs_review" ? "warn" : ""));
      const d = c.nearest_deadline;
      tr.appendChild(cell(d ? d.date + " " + d.label + (d.verified ? "" : "（未確認）") : "なし"));
      tr.appendChild(cell(c.unconfirmed, c.unconfirmed ? "warn" : ""));
      tr.addEventListener("click", () => openContract(c.contract_id));
      body.appendChild(tr);
    }
    const up = await call("GET", "/admin/contracts/upcoming" + q());
    const dl = $("deadlines"); dl.textContent = "";
    for (const d of (up.ok ? up.data.deadlines : [])) {
      const tr = document.createElement("tr"); tr.className = "pick";
      tr.appendChild(cell(d.date)); tr.appendChild(cell(d.title || d.contract_id)); tr.appendChild(cell(d.label));
      tr.appendChild(cell(daysText(d.days_left), d.days_left < 0 ? "warn" : "")); tr.appendChild(cell(d.verified ? "確認済み" : "未確認", d.verified ? "ok" : "warn"));
      tr.addEventListener("click", () => openContract(d.contract_id));
      dl.appendChild(tr);
    }
    show("契約数: " + list.data.contracts.length);
  }
  async function openContract(id) {
    const res = await call("GET", "/admin/contracts/" + encodeURIComponent(id) + q());
    if (!res.ok) { show("契約を取得できませんでした (" + res.status + ")"); return; }
    currentId = id; const c = res.data;
    $("detail").style.display = "block";
    $("d_title").textContent = id + "（" + (STATUS[c.status] || c.status) + "）";
    const body = $("fields"); body.textContent = "";
    for (const name of Object.keys(c.fields)) {
      const f = c.fields[name]; const tr = document.createElement("tr");
      tr.appendChild(cell(name));
      const valueCell = document.createElement("td"); const input = document.createElement("input");
      input.value = f.value == null ? "" : String(f.value); input.size = 22; valueCell.appendChild(input); tr.appendChild(valueCell);
      tr.appendChild(cell(STATE[f.state] || f.state, "st-" + f.state));
      const ev = document.createElement("td"); ev.className = "evidence";
      ev.textContent = f.evidence ? (f.evidence.page ? "p." + f.evidence.page + " " : "") + (f.evidence.text || "") : "";
      tr.appendChild(ev);
      const ops = document.createElement("td");
      ops.appendChild(button("確認", () => act("confirm", name, null)));
      ops.appendChild(button("訂正して保存", () => act("field", name, input.value)));
      tr.appendChild(ops); body.appendChild(tr);
    }
    const dl = $("d_deadlines"); dl.textContent = "";
    for (const d of c.deadlines) {
      const tr = document.createElement("tr");
      tr.appendChild(cell(d.label)); tr.appendChild(cell(d.date)); tr.appendChild(cell(daysText(d.days_left)));
      tr.appendChild(cell(d.verified ? "確認済み" : "未確認の値に基づく", d.verified ? "ok" : "warn"));
      const ops = document.createElement("td"); ops.appendChild(button("Outlook の下書きを作る", () => draft(d.kind))); tr.appendChild(ops);
      dl.appendChild(tr);
    }
    const h = $("history"); h.style.display = "block";
    h.textContent = c.history.map((e) => e.at + "  " + e.by + "  " + e.action + (e.field ? " " + e.field : "")).join("\n");
  }
  async function act(kind, name, value) {
    const body = { tenant_id: tenant(), name: name };
    if (kind === "field") body.value = value;
    const res = await call("POST", "/admin/contracts/" + encodeURIComponent(currentId) + "/" + kind, body);
    show(res.ok ? "保存しました" : "保存できませんでした: " + ((res.data && res.data.detail) || res.status));
    if (res.ok) { openContract(currentId); load(); }
  }
  async function draft(kind) {
    const mailbox = prompt("下書きを作るメールボックス（メールアドレス）");
    if (!mailbox) return;
    const res = await call("POST", "/admin/contracts/" + encodeURIComponent(currentId) + "/draft", { tenant_id: tenant(), kind: kind, mailbox: mailbox });
    show(res.ok ? "下書きを作りました（送信はしていません）。Outlook で内容を確認してから送信してください。" : "作れませんでした: " + ((res.data && res.data.detail) || res.status));
    out(res.ok ? res.data : null);
  }
  async function notify(dryRun) {
    if (!dryRun && !confirm("期限が近い契約の通知メールを送信します。よろしいですか？")) return;
    const res = await call("POST", "/admin/contracts/notify", { tenant_id: tenant(), dry_run: dryRun });
    show(res.ok ? (dryRun ? "通知の予定: " : "送信しました: ") + res.data.due + " 件（送信 " + res.data.sent + " / 失敗 " + res.data.failed + "）" : "実行できませんでした (" + res.status + ")");
    out(res.ok ? res.data.results : null);
  }
  async function importExtraction() {
    let extracted;
    try { extracted = JSON.parse($("i_json").value); } catch (_) { show("JSON として読めません"); return; }
    const res = await call("POST", "/admin/contracts/import", { tenant_id: tenant(), contract_id: $("i_id").value.trim(), source_doc: $("i_doc").value.trim(), extracted: extracted });
    show(res.ok ? "取り込みました（すべて未確認）。保存されなかった項目: " + Object.keys(res.data.rejected).length : "取り込めませんでした: " + ((res.data && res.data.detail) || res.status));
    out(res.ok ? res.data.rejected : null);
    if (res.ok) load();
  }
  $("reload").addEventListener("click", load);
  $("dryrun").addEventListener("click", () => notify(true));
  $("sendnow").addEventListener("click", () => notify(false));
  $("import").addEventListener("click", importExtraction);
  load();
})();
</script>
</body>
</html>
