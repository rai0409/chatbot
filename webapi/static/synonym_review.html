<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synonym Review</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #1f2933; background: #f7f8fa; }
  h1 { font-size: 1.3rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input, select, button { font: inherit; padding: 4px 8px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d9dee5; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #eef1f5; }
  .status-approved { color: #11733b; font-weight: 600; }
  .status-rejected { color: #a3261b; }
  #message { min-height: 1.4em; color: #3b5bdb; }
</style>
</head>
<body>
<!--admin-nav-->
<h1>シノニム候補のレビュー</h1>
<p>候補は承認するまで検索に使われません。承認後に「プロファイルへ反映」を実行します。</p>
<div class="bar">
  <label>管理トークン（任意。ログイン済みなら不要） <input id="token" type="password" autocomplete="off"></label>
  <label>状態
    <select id="status">
      <option value="candidate">未判定</option>
      <option value="approved">承認</option>
      <option value="rejected">却下</option>
      <option value="">すべて</option>
    </select>
  </label>
  <button id="reload">読み込み</button>
  <label>プロファイルID <input id="profile" value="default" size="16"></label>
  <button id="apply">承認済みをプロファイルへ反映</button>
</div>
<div id="message"></div>
<table>
  <thead><tr><th>正規形</th><th>同義語候補</th><th>抽出方法</th><th>状態</th><th>操作</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  function headers() {
    const h = { "Content-Type": "application/json" };
    if ($("token").value) h["X-Admin-Token"] = $("token").value;
    return h;
  }
  function show(text) { $("message").textContent = text; }
  function cell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }
  async function load() {
    const status = $("status").value;
    const resp = await (window.adminFetch || fetch)("/admin/synonyms/candidates" + (status ? "?status=" + encodeURIComponent(status) : ""), { headers: headers() });
    if (!resp.ok) { show("読み込みに失敗しました (" + resp.status + ")"); return; }
    const data = await resp.json();
    const body = $("rows");
    body.textContent = "";
    for (const item of data.items) {
      const tr = document.createElement("tr");
      tr.appendChild(cell(item.canonical || ""));
      tr.appendChild(cell((item.synonyms || []).join("、")));
      tr.appendChild(cell(item.method || ""));
      const st = cell(item.status);
      st.className = "status-" + item.status;
      tr.appendChild(st);
      const ops = document.createElement("td");
      for (const [label, value] of [["承認", "approved"], ["却下", "rejected"], ["保留", "candidate"]]) {
        const btn = document.createElement("button");
        btn.textContent = label;
        btn.addEventListener("click", () => decide(item.candidate_id, value));
        ops.appendChild(btn);
      }
      tr.appendChild(ops);
      body.appendChild(tr);
    }
    show("件数: " + data.total + "（" + JSON.stringify(data.counts) + "）");
  }
  async function decide(id, status) {
    const resp = await (window.adminFetch || fetch)("/admin/synonyms/decision", { method: "POST", headers: headers(), body: JSON.stringify({ candidate_id: id, status: status }) });
    show(resp.ok ? "更新しました" : "更新に失敗しました (" + resp.status + ")");
    if (resp.ok) load();
  }
  async function apply() {
    const resp = await (window.adminFetch || fetch)("/admin/synonyms/apply", { method: "POST", headers: headers(), body: JSON.stringify({ profile_id: $("profile").value }) });
    const data = resp.ok ? await resp.json() : null;
    show(resp.ok ? "反映しました: " + data.entries_before + " → " + data.entries_after + " 件" : "反映に失敗しました (" + resp.status + ")");
  }
  $("reload").addEventListener("click", load);
  $("apply").addEventListener("click", apply);
})();
</script>
</body>
</html>
