<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login</title>
<style>
  :root { --fg:#1f2933; --muted:#667085; --line:#d9dee5; --bg:#f4f6f9; --panel:#fff; --accent:#0b6b5b; --err:#a3261b; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e9ef; --muted:#9aa4b2; --line:#2a313c; --bg:#12161c; --panel:#181d24; --err:#ff9b9b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
         background: var(--bg); color: var(--fg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(420px, 100%);
         box-shadow: 0 1px 3px rgba(16,24,40,.1); }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { font-size: 13px; color: var(--muted); }
  input { font: inherit; width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); }
  button { font: inherit; width: 100%; padding: 10px; margin-top: 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; }
  #message { min-height: 1.4em; color: var(--err); margin-top: 10px; font-size: 13px; }
  .note { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<form id="login">
  <h1>管理コンソール</h1>
  <p class="sub">管理トークンでサインインします。</p>
  <label for="token">管理トークン</label>
  <input id="token" type="password" autocomplete="current-password" required autofocus>
  <button type="submit" id="submit">サインイン</button>
  <div id="message" role="alert"></div>
  <div class="note">サインインの状態はこのブラウザだけに保存され、一定時間で切れます。共用端末では使用後に「ログアウト」してください。</div>
</form>
<script src="/static/js/login.js"></script>
<script>
(function () {
  // Only same-site admin paths are allowed as the return target
  // (/static/js/login.js, tests/js/login.test.js).
  function nextPath() {
    return window.KuradenLogin.nextPath(location.search);
  }
  var form = document.getElementById("login");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var message = document.getElementById("message");
    var button = document.getElementById("submit");
    button.disabled = true; message.textContent = "";
    fetch("/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: document.getElementById("token").value })
    }).then(function (r) {
      document.getElementById("token").value = "";
      if (r.ok) { location.replace(nextPath()); return; }
      button.disabled = false;
      message.textContent = r.status === 429 ? "試行回数が多すぎます。しばらく待ってください。"
        : r.status === 404 ? "管理者認証が無効です（ADMIN_AUTH_ENABLED）。"
        : "サインインできませんでした。トークンを確認してください。";
    }).catch(function () { button.disabled = false; message.textContent = "サインインできませんでした。"; });
  });
})();
</script>
</body>
</html>
