<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文書ソース</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #1f2933; background: #f7f8fa; }
  h1 { font-size: 1.3rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input, select, button { font: inherit; padding: 4px 8px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d9dee5; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #eef1f5; }
  .held { color: #a3261b; font-weight: 600; }
  .off { color: #6b7280; }
  #message { min-height: 1.4em; color: #3b5bdb; }
  #detail { background: #fff; border: 1px solid #d9dee5; padding: 8px; white-space: pre-wrap; display: none; }
  details { margin-bottom: 12px; background: #fff; border: 1px solid #d9dee5; padding: 8px; }
  details label { display: inline-block; margin: 2px 8px 2px 0; }
</style>
</head>
<body>
<!--admin-nav-->
<h1>文書ソース</h1>
<p>登録したフォルダ（や SharePoint）を走査し、変更をステージング収集へ反映します。<b>大量の削除は、承認するまで保留されます。</b>
反映したあとの、配信中のコレクションへの昇格は「文書取込」から行います。</p>
<div class="bar">
  <label>管理トークン（任意。ログイン済みなら不要） <input id="token" type="password" autocomplete="off"></label>
  <button id="reload">読み込み</button>
</div>
<details>
  <summary>ソースを登録する</summary>
  <label>ID <input id="f_id" size="16" placeholder="policies"></label>
  <label>テナント <input id="f_tenant" size="12" value="default"></label>
  <label>種類 <select id="f_kind"><option value="folder">フォルダ</option><option value="sharepoint">SharePoint</option></select></label>
  <label>フォルダのパス <input id="f_path" size="30"></label>
  <label>ドライブ ID <input id="f_drive" size="16"></label>
  <label>ドライブ内のフォルダ <input id="f_folder" size="24" placeholder="/Shared Documents/Policies"></label>
  <label>走査の間隔（分、0 = 手動） <input id="f_schedule" size="6" value="0"></label>
  <label>収集名（空なら src-ID） <input id="f_collection" size="16"></label>
  <button id="create">登録</button>
</details>
<div id="message"></div>
<table>
  <thead><tr><th>ソース</th><th>テナント</th><th>種類</th><th>収集</th><th>間隔（分）</th><th>保留中の変更</th><th>最終走査</th><th>最終反映</th><th>操作</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<pre id="detail"></pre>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const doFetch = (url, options) => (window.adminFetch || fetch)(url, options);
  function headers() {
    const h = { "Content-Type": "application/json" };
    if ($("token").value) h["X-Admin-Token"] = $("token").value;
    return h;
  }
  function show(text) { $("message").textContent = text; }
  function detail(value) {
    const box = $("detail");
    box.style.display = value ? "block" : "none";
    box.textContent = value ? JSON.stringify(value, null, 2) : "";
  }
  function cell(text, cls) {
    const td = document.createElement("td");
    td.textContent = text == null ? "" : String(text);
    if (cls) td.className = cls;
    return td;
  }
  function button(label, onClick) {
    const b = document.createElement("button");
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }
  async function call(method, url, body) {
    const resp = await doFetch(url, { method: method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
    let data = null;
    try { data = await resp.json(); } catch (_) { data = null; }
    return { ok: resp.ok, status: resp.status, data: data };
  }
  function pendingText(row) {
    if (!row.pending) return "（未走査）";
    const p = row.pending;
    const text = "追加 " + p.added + " / 更新 " + p.modified + " / 削除 " + p.deleted;
    return row.guard && row.guard.hold ? text + "　保留: " + row.guard.reasons.join(", ") : text;
  }
  async function load() {
    const res = await call("GET", "/admin/sources/list");
    if (!res.ok) { show("読み込みに失敗しました (" + res.status + ")"); return; }
    const body = $("rows");
    body.textContent = "";
    for (const row of res.data.sources) {
      const tr = document.createElement("tr");
      tr.appendChild(cell(row.source_id + (row.enabled ? "" : "（無効）"), row.enabled ? "" : "off"));
      tr.appendChild(cell(row.tenant_id));
      tr.appendChild(cell(row.kind));
      tr.appendChild(cell(row.collection));
      tr.appendChild(cell(row.schedule_minutes));
      tr.appendChild(cell(pendingText(row), row.guard && row.guard.hold ? "held" : ""));
      tr.appendChild(cell(row.state.last_error ? row.state.last_error : (row.state.last_scan_at || "")));
      tr.appendChild(cell(row.state.last_apply_at || ""));
      const ops = document.createElement("td");
      ops.appendChild(button("走査", () => scan(row.source_id)));
      ops.appendChild(button("計画", () => plan(row.source_id)));
      ops.appendChild(button("反映", () => applyNow(row.source_id)));
      ops.appendChild(button("履歴", () => changes(row.source_id)));
      ops.appendChild(button(row.enabled ? "無効にする" : "有効にする", () => switchTo(row.source_id, row.enabled ? "disable" : "enable")));
      ops.appendChild(button("登録解除", () => remove(row.source_id)));
      tr.appendChild(ops);
      body.appendChild(tr);
    }
    show("ソース数: " + res.data.sources.length);
  }
  async function scan(id) {
    const res = await call("POST", "/admin/sources/" + encodeURIComponent(id) + "/scan");
    detail(res.data);
    show(res.ok ? (res.data.error ? "走査できませんでした: " + res.data.error : "走査しました") : "走査に失敗しました (" + res.status + ")");
    load();
  }
  async function plan(id) {
    const res = await call("GET", "/admin/sources/" + encodeURIComponent(id) + "/plan");
    detail(res.data);
    show(res.ok ? "計画の SHA-256: " + res.data.plan_sha256 : "計画を取得できませんでした (" + res.status + ")");
  }
  async function applyNow(id) {
    const res = await call("POST", "/admin/sources/" + encodeURIComponent(id) + "/apply", {});
    detail(res.data);
    if (!res.ok) { show("反映に失敗しました (" + res.status + ")"); return; }
    if (res.data.status === "held") {
      if (confirm("変更が大きいため保留されています（" + res.data.reasons.join(", ") + "）。\n計画の内容を確認したうえで、この計画を承認して反映しますか？")) {
        await approveAndApply(id, res.data.plan_sha256);
      } else {
        show("保留のままです");
      }
      return;
    }
    show("反映: " + res.data.status);
    load();
  }
  async function approveAndApply(id, sha) {
    const approved = await call("POST", "/admin/sources/" + encodeURIComponent(id) + "/approve", { plan_sha256: sha });
    if (!approved.ok) { show("承認できませんでした (" + approved.status + ")"); return; }
    const res = await call("POST", "/admin/sources/" + encodeURIComponent(id) + "/apply", { approval: sha });
    detail(res.data);
    show(res.ok ? "承認して反映しました: " + res.data.status : "反映に失敗しました (" + res.status + ")");
    load();
  }
  async function changes(id) {
    const res = await call("GET", "/admin/sources/" + encodeURIComponent(id) + "/changes");
    detail(res.data);
    show(res.ok ? "履歴を表示しました" : "履歴を取得できませんでした (" + res.status + ")");
  }
  async function switchTo(id, action) {
    const res = await call("POST", "/admin/sources/" + encodeURIComponent(id) + "/" + action);
    show(res.ok ? "更新しました" : "更新に失敗しました (" + res.status + ")");
    load();
  }
  async function remove(id) {
    if (!confirm("ソース " + id + " の登録を解除しますか？（収集・履歴は残ります）")) return;
    const res = await call("POST", "/admin/sources/" + encodeURIComponent(id) + "/remove");
    show(res.ok ? "登録を解除しました" : "解除に失敗しました (" + res.status + ")");
    load();
  }
  async function create() {
    const kind = $("f_kind").value;
    const body = {
      source_id: $("f_id").value.trim(), tenant_id: $("f_tenant").value.trim(), kind: kind,
      schedule_minutes: parseInt($("f_schedule").value || "0", 10) || 0,
    };
    if (kind === "folder") body.path = $("f_path").value.trim();
    else body.options = { drive_id: $("f_drive").value.trim(), folder: $("f_folder").value.trim() };
    if ($("f_collection").value.trim()) body.collection = $("f_collection").value.trim();
    const res = await call("POST", "/admin/sources", body);
    show(res.ok ? "登録しました" : "登録に失敗しました: " + ((res.data && res.data.detail) || res.status));
    if (res.ok) load();
  }
  $("reload").addEventListener("click", load);
  $("create").addEventListener("click", create);
  load();
})();
</script>
</body>
</html>
