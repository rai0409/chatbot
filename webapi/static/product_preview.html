<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Preview Chat</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #20242c;
      --muted: #657083;
      --line: #d9dee7;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --warn-bg: #fff7df;
      --warn-line: #e0b84d;
      --danger: #b42318;
      --ok: #16703c;
      --shadow: 0 1px 2px rgba(20, 28, 38, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 28px auto 48px;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .subtle {
      color: var(--muted);
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    form {
      display: grid;
      gap: 10px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      color: #394150;
      margin-bottom: 6px;
    }
    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 10px 11px;
    }
    textarea {
      resize: vertical;
      min-height: 104px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 10px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      padding: 9px 13px;
      min-height: 40px;
    }
    button:hover {
      background: var(--accent-strong);
    }
    button.secondary {
      background: #fff;
      color: #253040;
      border-color: var(--line);
    }
    button.secondary:hover {
      background: #f0f3f7;
    }
    button.feedback {
      min-width: 92px;
    }
    button.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.14);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }
    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }
    .error {
      color: var(--danger);
    }
    .ok {
      color: var(--ok);
    }
    .result-grid {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .kv {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      background: #fbfcfe;
      min-width: 0;
    }
    .kv b {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }
    .kv span {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
    .warning {
      border: 1px solid var(--warn-line);
      background: var(--warn-bg);
      border-radius: 6px;
      padding: 10px 12px;
      color: #5f4810;
      font-size: 14px;
    }
    .answer {
      white-space: pre-wrap;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
      padding: 12px;
      min-height: 48px;
    }
    .candidate-list {
      display: grid;
      gap: 10px;
    }
    .candidate-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    .candidate-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.12);
    }
    .candidate-head {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #3d4756;
      background: #f8fafc;
      font-size: 12px;
      padding: 2px 8px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .candidate-question {
      font-weight: 650;
      margin-bottom: 7px;
    }
    .candidate-preview {
      color: #394150;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .terms,
    .scores {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }
    .score {
      font-size: 12px;
      color: var(--muted);
      background: #f4f6f8;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
    }
    pre {
      margin: 0;
      max-height: 340px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      background: #111827;
      color: #e5e7eb;
      border-radius: 6px;
      padding: 12px;
    }
    .feedback-box {
      display: grid;
      gap: 10px;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 860px) {
      main {
        width: min(100% - 20px, 720px);
        margin-top: 16px;
      }
      .layout {
        grid-template-columns: 1fr;
      }
      .row,
      .meta-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Product Preview Chat</h1>
      <div class="subtle">Commercial chatbot response contract preview</div>
    </header>

    <div class="layout">
      <section class="panel">
        <form id="question-form">
          <div>
            <label for="query">Question</label>
            <textarea id="query" name="query" autocomplete="off"></textarea>
          </div>
          <div class="row">
            <div>
              <label for="tenant-id">Tenant</label>
              <input id="tenant-id" name="tenant_id" value="default" autocomplete="off">
            </div>
            <div>
              <label for="top-k">Top K</label>
              <input id="top-k" name="top_k" type="number" min="1" max="10" value="3">
            </div>
          </div>
          <div class="actions">
            <button id="submit-button" type="submit">Submit</button>
            <button id="clear-button" type="button" class="secondary">Clear</button>
            <span id="status" class="status"></span>
          </div>
        </form>

        <div id="result" class="result-grid hidden">
          <div class="meta-grid">
            <div class="kv"><b>answer_mode</b><span id="answer-mode"></span></div>
            <div class="kv"><b>confidence_route</b><span id="confidence-route"></span></div>
            <div class="kv"><b>request_id</b><span id="request-id"></span></div>
            <div class="kv"><b>feedback_token</b><span id="feedback-token"></span></div>
          </div>

          <div id="candidate-preview-warning" class="warning hidden">
            This is a candidate preview, not a final automatic answer.
          </div>
          <div id="warnings"></div>

          <section>
            <h2>Answer</h2>
            <div id="answer-text" class="answer"></div>
          </section>

          <section>
            <h2>Candidates</h2>
            <div id="candidates" class="candidate-list"></div>
          </section>
        </div>
      </section>

      <aside class="panel">
        <div class="feedback-box">
          <h2>Feedback</h2>
          <div class="actions">
            <button class="feedback secondary" data-feedback="good" type="button">Good</button>
            <button class="feedback secondary" data-feedback="bad" type="button">Bad</button>
            <button class="feedback secondary" data-feedback="neutral" type="button">Neutral</button>
            <button class="feedback secondary" data-feedback="human_review_requested" type="button">Review</button>
          </div>
          <div>
            <label for="bad-reason">Bad reason</label>
            <select id="bad-reason">
              <option value="">None</option>
              <option value="wrong_intent">wrong_intent</option>
              <option value="outdated">outdated</option>
              <option value="inaccurate">inaccurate</option>
              <option value="weak_evidence">weak_evidence</option>
              <option value="other">other</option>
            </select>
          </div>
          <div>
            <label for="comment">Comment</label>
            <textarea id="comment" rows="4"></textarea>
          </div>
          <div id="feedback-status" class="status"></div>
        </div>

        <section class="result-grid">
          <h2>Decision</h2>
          <pre id="decision-json">{}</pre>
          <h2>Profile</h2>
          <pre id="profile-json">{}</pre>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const state = {
      response: null,
      selectedCandidateId: null,
      shownCandidateIds: [],
    };

    const el = (id) => document.getElementById(id);
    const status = el("status");
    const feedbackStatus = el("feedback-status");
    const candidatesEl = el("candidates");
    const resultEl = el("result");

    function setStatus(message, className = "") {
      status.textContent = message;
      status.className = `status ${className}`.trim();
    }

    function setFeedbackStatus(message, className = "") {
      feedbackStatus.textContent = message;
      feedbackStatus.className = `status ${className}`.trim();
    }

    function safeText(value) {
      if (value === null || value === undefined) return "";
      return String(value);
    }

    function jsonBlock(value) {
      return JSON.stringify(value || {}, null, 2);
    }

    function scoreItems(scores) {
      if (!scores || typeof scores !== "object") return "";
      return Object.entries(scores)
        .filter(([, value]) => value !== null && value !== undefined)
        .map(([key, value]) => `<span class="score">${key}: ${safeText(value)}</span>`)
        .join("");
    }

    function termItems(terms) {
      if (!Array.isArray(terms)) return "";
      return terms.slice(0, 12)
        .map((term) => `<span class="badge">${escapeHtml(term)}</span>`)
        .join("");
    }

    function escapeHtml(value) {
      return safeText(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderResponse(payload) {
      state.response = payload;
      state.selectedCandidateId = null;
      state.shownCandidateIds = (payload.candidates || [])
        .map((candidate) => candidate.qa_id)
        .filter(Boolean);

      resultEl.classList.remove("hidden");
      el("answer-mode").textContent = safeText(payload.answer_mode);
      el("confidence-route").textContent = safeText(payload.confidence_route);
      el("request-id").textContent = safeText(payload.request_id);
      el("feedback-token").textContent = safeText(payload.feedback_token);
      el("answer-text").textContent = payload.answer_text || "";
      el("decision-json").textContent = jsonBlock(payload.decision);
      el("profile-json").textContent = jsonBlock(payload.profile_info);

      el("candidate-preview-warning").classList.toggle(
        "hidden",
        payload.answer_mode !== "approved_similar_candidate_only"
      );
      renderWarnings(payload.warnings || []);
      renderCandidates(payload.candidates || []);
      setFeedbackStatus("");
    }

    function renderWarnings(warnings) {
      const wrapper = el("warnings");
      wrapper.innerHTML = "";
      warnings.forEach((warning) => {
        const item = document.createElement("div");
        item.className = "warning";
        item.textContent = warning;
        wrapper.appendChild(item);
      });
    }

    function renderCandidates(candidates) {
      candidatesEl.innerHTML = "";
      if (!candidates.length) {
        const empty = document.createElement("div");
        empty.className = "subtle";
        empty.textContent = "No candidates";
        candidatesEl.appendChild(empty);
        return;
      }
      candidates.forEach((candidate, index) => {
        const card = document.createElement("article");
        card.className = "candidate-card";
        card.dataset.qaId = safeText(candidate.qa_id);
        card.innerHTML = `
          <div class="candidate-head">
            <span class="badge">${escapeHtml(candidate.qa_id || "unknown")}</span>
            <span class="badge">${escapeHtml(candidate.decision_route || "")}</span>
          </div>
          <div class="candidate-question">${escapeHtml(candidate.question_text || "")}</div>
          <div class="candidate-preview">${escapeHtml(candidate.approved_answer_preview || "")}</div>
          <div class="scores">${scoreItems(candidate.scores)}</div>
          <div class="terms">${termItems(candidate.matched_terms)}</div>
          <div class="actions" style="margin-top: 10px;">
            <button type="button" class="secondary select-candidate" data-qa-id="${escapeHtml(candidate.qa_id || "")}" data-rank="${index + 1}">Select</button>
          </div>
        `;
        candidatesEl.appendChild(card);
      });
    }

    async function submitQuestion(event) {
      event.preventDefault();
      const query = el("query").value.trim();
      if (!query) {
        setStatus("Question is required", "error");
        return;
      }
      const body = {
        query,
        tenant_id: el("tenant-id").value.trim() || "default",
        top_k: Number(el("top-k").value || 3),
      };
      setStatus("Loading...");
      el("submit-button").disabled = true;
      try {
        const response = await fetch("/chat/product-preview", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Request failed");
        }
        renderResponse(payload);
        setStatus("Loaded", "ok");
      } catch (error) {
        setStatus(error.message || "Request failed", "error");
      } finally {
        el("submit-button").disabled = false;
      }
    }

    async function submitFeedback(feedbackType) {
      const payload = state.response;
      if (!payload || !payload.feedback_token) {
        setFeedbackStatus("No response token", "error");
        return;
      }
      const selectedCard = document.querySelector(".candidate-card.active");
      const selectedRank = selectedCard
        ? Number(selectedCard.querySelector(".select-candidate")?.dataset.rank || 0)
        : null;
      const body = {
        feedback_token: payload.feedback_token,
        feedback_type: feedbackType,
        request_id: payload.request_id,
        trace_id: payload.trace_id,
        tenant_id: payload.tenant_id || "default",
        selected_candidate_id: state.selectedCandidateId,
        shown_candidate_ids: state.shownCandidateIds,
        shown_rank: selectedRank || null,
        bad_reason: feedbackType === "bad" ? el("bad-reason").value || null : null,
        comment: el("comment").value.trim() || null,
      };
      setFeedbackStatus("Sending...");
      try {
        const response = await fetch("/chat/feedback", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "Feedback failed");
        }
        setFeedbackStatus(result.stored ? "Feedback stored" : `Feedback accepted: ${result.warning || "not stored"}`, result.stored ? "ok" : "error");
      } catch (error) {
        setFeedbackStatus(error.message || "Feedback failed", "error");
      }
    }

    el("question-form").addEventListener("submit", submitQuestion);
    el("clear-button").addEventListener("click", () => {
      el("query").value = "";
      resultEl.classList.add("hidden");
      state.response = null;
      state.selectedCandidateId = null;
      state.shownCandidateIds = [];
      setStatus("");
      setFeedbackStatus("");
    });
    document.querySelectorAll("button.feedback").forEach((button) => {
      button.addEventListener("click", () => submitFeedback(button.dataset.feedback));
    });
    candidatesEl.addEventListener("click", (event) => {
      const button = event.target.closest(".select-candidate");
      if (!button) return;
      state.selectedCandidateId = button.dataset.qaId || null;
      document.querySelectorAll(".candidate-card").forEach((card) => card.classList.remove("active"));
      button.closest(".candidate-card")?.classList.add("active");
    });
  </script>
</body>
</html>
